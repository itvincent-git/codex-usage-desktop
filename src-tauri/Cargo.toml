[package]
name = "codex-usage-desktop"
version = "2.3.2"
description = "Local-first desktop dashboard for Codex CLI token usage and cost estimates."
authors = ["vincent"]
license = "MIT"
repository = "https://github.com/itvincent-git/codex-usage-desktop"
homepage = "https://github.com/itvincent-git/codex-usage-desktop"
keywords = ["codex-cli", "openai-codex", "token-usage", "tauri", "desktop"]
edition = "2021"

[lib]
name = "codex_usage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
debug = 1

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"
iana-time-zone = "0.1"
log = "0.4.29"
reqwest = { version = "0.12", features = ["blocking", "json", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.94.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2.0.0"
tauri-plugin-updater = "2"
walkdir = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
