[package]
name = "codex-usage-desktop"
version = "0.1.0"
description = "Local-first macOS dashboard for Codex CLI token usage and cost estimates."
authors = ["vincent"]
license = "MIT"
repository = "https://github.com/itvincent-git/codex-usage-desktop"
homepage = "https://github.com/itvincent-git/codex-usage-desktop"
keywords = ["codex-cli", "openai-codex", "token-usage", "tauri", "macos"]
edition = "2021"

[lib]
name = "codex_usage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"
iana-time-zone = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.94.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
walkdir = "2"
